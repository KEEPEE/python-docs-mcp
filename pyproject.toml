[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-docs-mcp"
version = "0.2.0"
description = "Real-time CPython stdlib documentation and PyPI package info MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "mcp",
  "model-context-protocol",
  "python",
  "cpython",
  "stdlib",
  "pypi",
  "documentation",
  "developer-tools",
  "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=1.2.0,<2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "markdownify>=0.13",
]

[project.urls]
Homepage = "https://github.com/KEEPEE/python-docs-mcp"
Repository = "https://github.com/KEEPEE/python-docs-mcp.git"
Issues = "https://github.com/KEEPEE/python-docs-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
python-docs = "python_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python_docs_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

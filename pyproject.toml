[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-docs-mcp"
version = "0.2.0"
description = "Real-time CPython stdlib documentation and PyPI package info MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0,<2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
python-docs = "python_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python_docs_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
